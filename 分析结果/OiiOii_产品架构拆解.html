}

.form-check:not(.form-switch)

.form-check-input[type=&quot;radio&quot;]:checked {

  outline: 2px solid var(--ring);
  outline-offset: 2px;

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {

  width: 32px;
  height: 20px;
  border: 0;

  background: var(--muted);
  box-shadow: none;

.form-switch .form-check-input:checked {

.form-switch .form-check-input:checked::before {

      &lt;h1&gt;完整产品架构逆向拆解&lt;/h1&gt;
      &lt;p&gt;从需求进入、Agent 协作、工具执行、全局上下文与资产流，重建 OiiOii 的可观察产品架构；把当前事实、行为推断、稳定性建议与未知区域严格分开。&lt;/p&gt;
      &lt;div class=&quot;oa-meta&quot;&gt;&lt;span&gt;18 张原始截图&lt;/span&gt;&lt;span&gt;8 个创作阶段&lt;/span&gt;&lt;span&gt;6 个可见命名身份＋1 个名称未确认角色阶段&lt;/span&gt;&lt;span&gt;4 张核心架构图&lt;/span&gt;&lt;span&gt;只读取证据&lt;/span&gt;&lt;/div&gt;

      &lt;main&gt;
        &lt;section id=&quot;s1&quot;&gt;
          &lt;h2&gt;1. 执行摘要&lt;/h2&gt;
          &lt;p class=&quot;oa-lead&quot;&gt;一句话：OiiOii 是一个以聊天为控制入口、以画布为资产工作台、由多个专业 Agent 顺序协作并调用生成能力完成短片的创作系统，但当前页面暴露出“聊天叙述、任务状态、画布资产和资产库”缺少统一事实源。&lt;/p&gt;
          &lt;div class=&quot;oa-stats&quot;&gt;&lt;div class=&quot;oa-stat&quot;&gt;&lt;b&gt;7&lt;/b&gt;&lt;span&gt;可观察身份：Oii Agent、5 个明确专业 Agent＋1 个名称未清晰的角色阶段&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;oa-stat&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;span&gt;分镜视频资产&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;oa-stat&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;span&gt;直接状态裂缝&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;oa-stat&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;span&gt;明确 Agent 邀请事件&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;div class=&quot;oa-callout&quot;&gt;&lt;strong&gt;核心结论：&lt;/strong&gt;页面足以确认“需求→参数→剧本→角色→场景→道具→分镜→视频→预览/剪辑”的产品骨架；不足以确认真实主控路由、数据库、队列、模型网关、计费冻结、安全拦截和重试实现。&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s2&quot;&gt;
          &lt;h2&gt;2. 证据来源与证据缺口&lt;/h2&gt;
          &lt;p class=&quot;oa-lead&quot;&gt;证据仅来自本轮重新查看的 S01–S18 原图。文件名仅用于索引，不能证明截图内容；S12–S15 的文件名与画面实际内容明显不一致。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;编号&lt;/th&gt;&lt;th&gt;分类&lt;/th&gt;&lt;th&gt;可复核页面事实&lt;/th&gt;&lt;th&gt;截图&lt;/th&gt;&lt;th&gt;支持的架构结论&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E01&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;用户提交现代言情故事；艺术总监显示“规划完成”；任务卡“激活工作流”“更新短片参数”完成；可见“影片长度”和“3D言情”。&lt;/td&gt;&lt;td&gt;S01、S11&lt;/td&gt;&lt;td&gt;需求入口、入口规划、工作流与项目参数写入动作。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E02&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;公开摘要写“搜索故事动画剧本知识库…‘觉醒’”；“剧本信息已完成！您满意吗？”；按钮“满意，请继续 / 我要修改”。&lt;/td&gt;&lt;td&gt;S02&lt;/td&gt;&lt;td&gt;剧本阶段、知识检索意图、用户确认门。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E03&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;画布存在“编剧”“我的剧本”卡片和“查看”入口。&lt;/td&gt;&lt;td&gt;S10&lt;/td&gt;&lt;td&gt;剧本资产真实存在；编剧身份存在。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E04&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;角色阶段显示“3个图片”，许清和、顾砚、江叙白主图已生成；可点击角色卡修改提示词；有满意/修改按钮。&lt;/td&gt;&lt;td&gt;S03&lt;/td&gt;&lt;td&gt;角色资产、提示词可编辑、确认门。Agent 名称未清晰露出。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E05&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;用户输入“生成道具”；场景设计师先提取协议、钢笔等道具，再发现“场景的多视图还没有生成”，停止道具阶段并补场景多视图。&lt;/td&gt;&lt;td&gt;S04&lt;/td&gt;&lt;td&gt;前置依赖检查与补偿流程；场景多视图是道具阶段前置。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E06&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;道具设计师说明角色、场景、道具已准备；事件“@道具设计师 邀请 @分镜师 加入了群聊”。&lt;/td&gt;&lt;td&gt;S16&lt;/td&gt;&lt;td&gt;唯一明确的 Agent→Agent 交接。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E07&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;分镜配置显示 Seedance 2.0、Pro/Fast、720p/480p；自定义音色只在 Seedance 2.0 生效。&lt;/td&gt;&lt;td&gt;S05、S16&lt;/td&gt;&lt;td&gt;模型、模式、分辨率和音色兼容约束。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E08&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;分镜师从剧本提取4个镜头；用户选择不需要分镜图；公开摘要写搜索运镜知识、获取角色与道具代称；提供生成1个试片或全部视频的按钮。&lt;/td&gt;&lt;td&gt;S17&lt;/td&gt;&lt;td&gt;分镜结构、提示词、知识意图、试片/批量确认门。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E09&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;分镜1视频完成；用户“满意，请继续”；分镜师继续生成剩余3个。&lt;/td&gt;&lt;td&gt;S06&lt;/td&gt;&lt;td&gt;试片验证后批量继续。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E10&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;结果卡“3个视频”；文案称分镜[2、3、4]已生成，同时公开摘要仍写“正在为您生成”，任务列表显示“当前无任务”。&lt;/td&gt;&lt;td&gt;S12–S15、S18&lt;/td&gt;&lt;td&gt;聊天、工具摘要与任务面板状态冲突。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E11&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;画布显示4个分镜卡；入口“预览最终视频”“去剪辑”“下载所有分镜”。&lt;/td&gt;&lt;td&gt;S07&lt;/td&gt;&lt;td&gt;视频资产与预览、剪辑、下载能力。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E12&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;预览弹窗：“分镜视频、音效、BGM等素材未完全生成”，按钮“取消 / 确定”。&lt;/td&gt;&lt;td&gt;S08&lt;/td&gt;&lt;td&gt;视频片段完成不等于最终成片素材完整。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E13&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;右侧“资产”页显示“这里还什么都没有”，同时画布中央已有分镜视频卡。&lt;/td&gt;&lt;td&gt;S09&lt;/td&gt;&lt;td&gt;画布资产与资产库状态不一致。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E14&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;顶部导航“总览、剧本、角色、场景、道具、分镜”；页面同时有聊天、画布、资产、任务列表。&lt;/td&gt;&lt;td&gt;多张截图&lt;/td&gt;&lt;td&gt;工作台信息架构和多状态表面。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E15&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;页面显示“发布”和“1,233 STAR”。&lt;/td&gt;&lt;td&gt;多张截图&lt;/td&gt;&lt;td&gt;存在发布入口和某种 STAR 数值；是否余额、可用额度或套餐未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E16&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;合理推断&lt;/span&gt;&lt;/td&gt;&lt;td&gt;从相邻阶段和资产顺序推导艺术总监→编剧→角色→场景→道具→分镜。&lt;/td&gt;&lt;td&gt;S01–S17&lt;/td&gt;&lt;td&gt;除道具→分镜外，交接事件和 payload 均未直接展示。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E17&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未知&lt;/span&gt;&lt;/td&gt;&lt;td&gt;没有真实生成失败、积分不足、安全拦截、用户中断、自动重试、退款或历史版本页面。&lt;/td&gt;&lt;td&gt;全部截图&lt;/td&gt;&lt;td&gt;不能确认异常基础设施。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ARC-E18&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未知&lt;/span&gt;&lt;/td&gt;&lt;td&gt;没有后端语言、数据库、消息队列、对象存储、CDN、模型网关或鉴权实现证据。&lt;/td&gt;&lt;td&gt;全部截图&lt;/td&gt;&lt;td&gt;底层技术只能做能力需求和建议。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

        &lt;section id=&quot;s3&quot;&gt;
          &lt;h2&gt;3. 核心功能域&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;从用户视角拆出当前可见功能，并把模板中未出现的能力降级。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;功能域&lt;/th&gt;&lt;th&gt;当前可观察能力&lt;/th&gt;&lt;th&gt;证据等级&lt;/th&gt;&lt;th&gt;缺口&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;账号、权限、会员&lt;/td&gt;&lt;td&gt;头像、STAR 数值、发布入口。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未知&lt;/span&gt;&lt;/td&gt;&lt;td&gt;登录、套餐、权限和租户隔离均未展示。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;项目入口与管理&lt;/td&gt;&lt;td&gt;项目标题、Oii Agent 会话、工作流激活。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;项目列表、复制、归档和删除未展示。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;剧本&lt;/td&gt;&lt;td&gt;自然语言需求、知识摘要、剧本资产、查看、满意/修改。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;历史版本和结构化字段未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;风格&lt;/td&gt;&lt;td&gt;底部选择“3D言情”。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;风格 ID、提示词展开和风格库结构未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;角色与一致性&lt;/td&gt;&lt;td&gt;3名角色主图、卡片提示词可修改。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Face ID、角色多视图和锁脸机制未证实。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;场景&lt;/td&gt;&lt;td&gt;场景主图与多视图；缺失时阻断道具阶段并补偿。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;场景版本和引用 ID 未展示。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;道具&lt;/td&gt;&lt;td&gt;从剧本抽取道具、生成道具卡；邀请分镜师。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;道具引用结构未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;分镜&lt;/td&gt;&lt;td&gt;提取4个镜头、生成提示词、选择试片或全部生成。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;稳定引用、版本依赖和时长校验未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;视频生成&lt;/td&gt;&lt;td&gt;Seedance 2.0、Pro/Fast、720p/480p、1+3试片策略。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;独立视频 Agent、调用参数、成本、失败率未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;音频与音色&lt;/td&gt;&lt;td&gt;提示词提到音效/台词；自定义音色兼容提示；预览警告 BGM/音效缺失。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;音频或 TTS 资产未见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;预览、剪辑、下载&lt;/td&gt;&lt;td&gt;最终预览、去剪辑、下载所有分镜；不完整素材确认弹窗。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;剪辑器内部和最终导出结果未见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;资产与历史&lt;/td&gt;&lt;td&gt;画布存在资产卡；资产页为空。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;资产库同步、版本历史和回滚未见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;计费、错误、任务&lt;/td&gt;&lt;td&gt;STAR 数值、任务列表、公开执行摘要。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;部分确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;余额不足、扣费、退款、失败与重试未展示。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s4&quot;&gt;
          &lt;h2&gt;4. 端到端功能流转：五条流并行&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;每一阶段把用户、Agent、工具、上下文和资产放在同一行，避免只看聊天文本。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;阶段&lt;/th&gt;&lt;th&gt;用户交互流&lt;/th&gt;&lt;th&gt;Agent 控制流&lt;/th&gt;&lt;th&gt;工具调用流&lt;/th&gt;&lt;th&gt;数据 / 状态流&lt;/th&gt;&lt;th&gt;资产流与失败分支&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;1 需求入口&lt;/td&gt;&lt;td&gt;输入现代言情故事。&lt;/td&gt;&lt;td&gt;艺术总监接管；Oii Agent 是否路由未知。&lt;/td&gt;&lt;td&gt;激活工作流、更新短片参数（功能命名）。&lt;/td&gt;&lt;td&gt;写入需求、影片长度、风格；真实字段未知。&lt;/td&gt;&lt;td&gt;无媒体资产；输入不足的处理未见。ARC-E01&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;2 剧本&lt;/td&gt;&lt;td&gt;满意继续或提出修改。&lt;/td&gt;&lt;td&gt;编剧阶段处理。&lt;/td&gt;&lt;td&gt;知识检索仅为公开摘要；剧本生成工具名未知。&lt;/td&gt;&lt;td&gt;写入“我的剧本”和确认状态。&lt;/td&gt;&lt;td&gt;文字资产；修改后下游失效机制未知。ARC-E02–03&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;3 角色&lt;/td&gt;&lt;td&gt;满意/修改；可编辑角色提示词。&lt;/td&gt;&lt;td&gt;角色阶段 Agent，准确名称未见。&lt;/td&gt;&lt;td&gt;生成角色主图（功能命名）。&lt;/td&gt;&lt;td&gt;角色列表、主图、提示词应被写入。&lt;/td&gt;&lt;td&gt;3张角色图；Face ID 未见。ARC-E04&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;4 场景&lt;/td&gt;&lt;td&gt;选择继续并发出“生成道具”。&lt;/td&gt;&lt;td&gt;场景设计师发现多视图缺失。&lt;/td&gt;&lt;td&gt;生成场景多视图（功能命名；结果由画布支持）。&lt;/td&gt;&lt;td&gt;前置依赖检查阻断道具阶段。&lt;/td&gt;&lt;td&gt;场景主图/多视图；缺失→补偿→再继续。ARC-E05&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;5 道具&lt;/td&gt;&lt;td&gt;确认上游结果后继续。&lt;/td&gt;&lt;td&gt;道具设计师完成后邀请分镜师。&lt;/td&gt;&lt;td&gt;抽取道具、生成主图（功能命名）。&lt;/td&gt;&lt;td&gt;角色/场景/道具被口头宣称准备完毕。&lt;/td&gt;&lt;td&gt;道具卡；唯一明确 Agent 交接。ARC-E06&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;6 分镜配置&lt;/td&gt;&lt;td&gt;选择模型、Pro/Fast、720p/480p、是否需要分镜图。&lt;/td&gt;&lt;td&gt;分镜师提取4个镜头。&lt;/td&gt;&lt;td&gt;解析剧本、构建提示词；知识/代称获取只见摘要。&lt;/td&gt;&lt;td&gt;写入模型配置、分镜列表、提示词和引用。&lt;/td&gt;&lt;td&gt;未选择分镜图，直接进入视频提示词。ARC-E07–08&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;7 试片&lt;/td&gt;&lt;td&gt;选择先生成1个分镜视频；满意后继续。&lt;/td&gt;&lt;td&gt;分镜师驱动视频生成；无独立视频 Agent。&lt;/td&gt;&lt;td&gt;生成视频（功能命名）。&lt;/td&gt;&lt;td&gt;写入分镜1视频结果与用户确认。&lt;/td&gt;&lt;td&gt;试片失败分支未见；修改入口存在。ARC-E09&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;8 批量视频&lt;/td&gt;&lt;td&gt;满意后生成剩余3个。&lt;/td&gt;&lt;td&gt;分镜师继续。&lt;/td&gt;&lt;td&gt;批量/逐个视频生成。&lt;/td&gt;&lt;td&gt;聊天称完成，但公开摘要仍“正在生成”，任务列表无任务。&lt;/td&gt;&lt;td&gt;3个结果＋画布4卡；状态冲突。ARC-E10–11&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;9 最终预览&lt;/td&gt;&lt;td&gt;预览、剪辑、下载；遇警告可取消或确定。&lt;/td&gt;&lt;td&gt;无命名预览/剪辑 Agent。&lt;/td&gt;&lt;td&gt;预览与导出工具只见入口。&lt;/td&gt;&lt;td&gt;视频完成状态没有覆盖音效/BGM完整度。&lt;/td&gt;&lt;td&gt;音频素材缺失；资产库仍空。ARC-E11–13&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s5&quot;&gt;
          &lt;h2&gt;5. 产品分层架构&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;分层描述“需要什么能力”，不把无法从前端确认的实现写成事实。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;层级&lt;/th&gt;&lt;th&gt;已确认组件&lt;/th&gt;&lt;th&gt;合理推断&lt;/th&gt;&lt;th&gt;建议补充 / 未知&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;1 用户与渠道&lt;/td&gt;&lt;td&gt;用户会话、STAR 数值、发布入口。&lt;/td&gt;&lt;td&gt;项目归属与个人资产。&lt;/td&gt;&lt;td&gt;认证、套餐、权限、租户隔离、发布渠道。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;2 交互与工作台&lt;/td&gt;&lt;td&gt;聊天、Agent 名称、画布、资产卡、表单、确认按钮、任务面板、预览/剪辑入口、错误警告。&lt;/td&gt;&lt;td&gt;统一工作台前端状态。&lt;/td&gt;&lt;td&gt;状态冲突提示、版本浏览、可访问性验证。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;3 产品应用&lt;/td&gt;&lt;td&gt;剧本、角色、场景、道具、分镜、视频与资产卡。&lt;/td&gt;&lt;td&gt;项目、音频和发布管理。&lt;/td&gt;&lt;td&gt;版本管理、依赖图、局部重算。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;4 Agent 与编排&lt;/td&gt;&lt;td&gt;多个专业 Agent、规划摘要、确认门、道具→分镜邀请。&lt;/td&gt;&lt;td&gt;Oii Agent 或工作流服务负责编排。&lt;/td&gt;&lt;td&gt;统一状态机、中断、幂等、完成门和补偿事务。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;5 工具与服务&lt;/td&gt;&lt;td&gt;业务结果支持文本/图像/视频生成；预览/下载入口。&lt;/td&gt;&lt;td&gt;上下文读写、剧本解析、资产引用。&lt;/td&gt;&lt;td&gt;余额检查、安全检查、合成、质量校验和状态一致性服务。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;6 模型接入&lt;/td&gt;&lt;td&gt;Seedance 2.0、模式、分辨率。&lt;/td&gt;&lt;td&gt;文本与图像生成模型存在。&lt;/td&gt;&lt;td&gt;模型网关、能力注册表、动态路由、降级、成本/延迟数据。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;7 上下文与数据&lt;/td&gt;&lt;td&gt;页面表现出需求、参数、剧本、角色、场景、道具、分镜、视频和任务状态。&lt;/td&gt;&lt;td&gt;结构化项目上下文和资产引用。&lt;/td&gt;&lt;td&gt;单一事实源、事件日志、版本、确认、错误、计费与评测上下文。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;8 知识与公共资产&lt;/td&gt;&lt;td&gt;公开摘要提及剧本知识库、运镜知识；风格选择可见。&lt;/td&gt;&lt;td&gt;提示词模板、模型能力知识。&lt;/td&gt;&lt;td&gt;知识版本、来源、过期策略、公共/私有隔离。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;9 基础设施与治理&lt;/td&gt;&lt;td&gt;无直接后端证据。&lt;/td&gt;&lt;td&gt;异步视频任务需要队列、存储和状态回写。&lt;/td&gt;&lt;td&gt;认证、对象存储/CDN、数据库、队列、追踪、安全、告警、成本控制。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s6&quot;&gt;
          &lt;h2&gt;6. Agent、工具和全局上下文关系&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;只有页面明确出现的名称才标为已确认。角色阶段存在真实输出，但 Agent 名称没有清晰露出。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;Agent / 身份&lt;/th&gt;&lt;th&gt;边界&lt;/th&gt;&lt;th&gt;输入&lt;/th&gt;&lt;th&gt;可观察判断&lt;/th&gt;&lt;th&gt;工具 / 结果&lt;/th&gt;&lt;th&gt;交接&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;Oii Agent&lt;/td&gt;&lt;td&gt;会话/任务容器；是否主控未知。&lt;/td&gt;&lt;td&gt;用户消息、当前 Space。&lt;/td&gt;&lt;td&gt;无独立公开判断摘要。&lt;/td&gt;&lt;td&gt;无可归属工具结果。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未知&lt;/span&gt;可能路由专业 Agent。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;艺术总监&lt;/td&gt;&lt;td&gt;理解需求、激活入口、更新参数；不生产下游资产。&lt;/td&gt;&lt;td&gt;原始故事、风格、影片长度。&lt;/td&gt;&lt;td&gt;“规划完成”，理解故事框架并启动流程。&lt;/td&gt;&lt;td&gt;激活工作流、更新短片参数。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;推断&lt;/span&gt;编剧。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;编剧&lt;/td&gt;&lt;td&gt;生成和修改剧本。&lt;/td&gt;&lt;td&gt;原始需求、项目参数、可能的剧本知识。&lt;/td&gt;&lt;td&gt;公开摘要提到搜索“觉醒”灵感；请求满意确认。&lt;/td&gt;&lt;td&gt;剧本资产“我的剧本”。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;推断&lt;/span&gt;角色阶段。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;角色阶段 Agent&lt;/td&gt;&lt;td&gt;生成角色主图和可编辑提示词。&lt;/td&gt;&lt;td&gt;剧本角色描述、风格。&lt;/td&gt;&lt;td&gt;根据外貌构建主图提示词。&lt;/td&gt;&lt;td&gt;3个角色图片。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;推断&lt;/span&gt;场景设计师；准确 Agent 名称未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;场景设计师&lt;/td&gt;&lt;td&gt;场景资产与多视图；可阻断错误顺序。&lt;/td&gt;&lt;td&gt;剧本、角色、风格、用户“生成道具”。&lt;/td&gt;&lt;td&gt;发现场景多视图缺失，先补偿。&lt;/td&gt;&lt;td&gt;场景多视图结果由画布支持。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;推断&lt;/span&gt;道具设计师。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;道具设计师&lt;/td&gt;&lt;td&gt;抽取并生成关键道具。&lt;/td&gt;&lt;td&gt;剧本、角色、场景、多视图。&lt;/td&gt;&lt;td&gt;判断上游资产已准备。&lt;/td&gt;&lt;td&gt;道具卡；邀请 Agent 事件。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;邀请分镜师。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;分镜师&lt;/td&gt;&lt;td&gt;拆镜头、生成提示词、驱动视频生成。&lt;/td&gt;&lt;td&gt;剧本、角色/场景/道具、模型配置、用户确认。&lt;/td&gt;&lt;td&gt;提取4镜头；选择试片/全部；公开摘要提及运镜知识和代称。&lt;/td&gt;&lt;td&gt;分镜提示词、1+3视频结果。&lt;/td&gt;&lt;td&gt;预览/剪辑/下载界面；无命名下游 Agent。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

          &lt;h3&gt;Agent—工具—上下文—资产交接图&lt;/h3&gt;

          &lt;h3&gt;工具总表&lt;/h3&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;功能命名（非官方）&lt;/th&gt;&lt;th&gt;所属阶段&lt;/th&gt;&lt;th&gt;页面证明&lt;/th&gt;&lt;th&gt;执行状态&lt;/th&gt;&lt;th&gt;未知 / 风险&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;激活工作流&lt;/td&gt;&lt;td&gt;艺术总监&lt;/td&gt;&lt;td&gt;完成勾选&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认动作完成&lt;/span&gt;&lt;/td&gt;&lt;td&gt;参数、幂等和工作流 ID 未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;更新短片参数&lt;/td&gt;&lt;td&gt;艺术总监&lt;/td&gt;&lt;td&gt;完成勾选&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认动作完成&lt;/span&gt;&lt;/td&gt;&lt;td&gt;字段结构和版本未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;搜索剧本知识&lt;/td&gt;&lt;td&gt;编剧&lt;/td&gt;&lt;td&gt;公开“思考完成”摘要&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;只确认口头摘要&lt;/span&gt;&lt;/td&gt;&lt;td&gt;不可当作真实工具调用。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;生成剧本&lt;/td&gt;&lt;td&gt;编剧&lt;/td&gt;&lt;td&gt;“我的剧本”资产&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;业务结果存在&lt;/span&gt;&lt;/td&gt;&lt;td&gt;模型、调用参数未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;生成角色主图&lt;/td&gt;&lt;td&gt;角色阶段&lt;/td&gt;&lt;td&gt;3个图片与角色卡&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;业务结果存在&lt;/span&gt;&lt;/td&gt;&lt;td&gt;Agent 名称、Face ID、候选数未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;生成场景多视图&lt;/td&gt;&lt;td&gt;场景设计师&lt;/td&gt;&lt;td&gt;补偿计划＋后续多视图资产&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;业务执行可推断&lt;/span&gt;&lt;/td&gt;&lt;td&gt;精确调用与验证未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;生成道具主图&lt;/td&gt;&lt;td&gt;道具设计师&lt;/td&gt;&lt;td&gt;道具卡可见&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;业务结果存在&lt;/span&gt;&lt;/td&gt;&lt;td&gt;精确工具与版本未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;邀请下游 Agent&lt;/td&gt;&lt;td&gt;道具设计师&lt;/td&gt;&lt;td&gt;邀请 @分镜师 事件&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;payload 未展示。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;解析剧本为4镜头&lt;/td&gt;&lt;td&gt;分镜师&lt;/td&gt;&lt;td&gt;公开规划＋4个分镜输出&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;业务结果存在&lt;/span&gt;&lt;/td&gt;&lt;td&gt;结构化 schema 未展示。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;搜索运镜知识 / 获取代称&lt;/td&gt;&lt;td&gt;分镜师&lt;/td&gt;&lt;td&gt;公开“思考完成”摘要&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;只确认口头摘要&lt;/span&gt;&lt;/td&gt;&lt;td&gt;不可当作真实工具调用。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;生成视频&lt;/td&gt;&lt;td&gt;分镜师驱动&lt;/td&gt;&lt;td&gt;1个试片＋3个结果＋4个画布卡&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;业务结果存在&lt;/span&gt;&lt;/td&gt;&lt;td&gt;无独立视频 Agent；状态同步冲突。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;预览 / 剪辑 / 下载&lt;/td&gt;&lt;td&gt;界面&lt;/td&gt;&lt;td&gt;三个入口和预览警告&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;入口存在&lt;/span&gt;&lt;/td&gt;&lt;td&gt;最终成片与导出结果未验证。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;余额检查 / 安全检查 / 重试&lt;/td&gt;&lt;td&gt;平台&lt;/td&gt;&lt;td&gt;无样本&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未知&lt;/span&gt;&lt;/td&gt;&lt;td&gt;只能作为 To-Be 服务。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s7&quot;&gt;
          &lt;h2&gt;7. 全局上下文架构&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;以下 Context 名称是架构分析模板，不是 OiiOii 已确认字段名。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;上下文对象&lt;/th&gt;&lt;th&gt;可能字段 / 对象&lt;/th&gt;&lt;th&gt;生产者&lt;/th&gt;&lt;th&gt;消费者&lt;/th&gt;&lt;th&gt;版本与失效&lt;/th&gt;&lt;th&gt;证据等级&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;UserContext&lt;/td&gt;&lt;td&gt;界面语言、STAR、个人资产、音色、偏好、权限。&lt;/td&gt;&lt;td&gt;用户/平台&lt;/td&gt;&lt;td&gt;工作台、Agent、计费&lt;/td&gt;&lt;td&gt;账户级版本；本项目只见中文与 STAR。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;大部分未知&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ProjectConfig&lt;/td&gt;&lt;td&gt;项目标题、影片长度、风格、比例、对白语言、模型、分辨率。&lt;/td&gt;&lt;td&gt;用户、艺术总监&lt;/td&gt;&lt;td&gt;编剧及下游 Agent&lt;/td&gt;&lt;td&gt;全局参数变化应失效相关下游。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;部分确认&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ScriptContext&lt;/td&gt;&lt;td&gt;原始需求、“我的剧本”、结构化角色/场景/道具线索、确认状态。&lt;/td&gt;&lt;td&gt;用户、编剧&lt;/td&gt;&lt;td&gt;角色、场景、道具、分镜&lt;/td&gt;&lt;td&gt;剧本修改应触发依赖图重算。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;结构推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;CharacterContext&lt;/td&gt;&lt;td&gt;许清和、顾砚、江叙白；主图、提示词、可能的参考标识。&lt;/td&gt;&lt;td&gt;角色阶段 Agent&lt;/td&gt;&lt;td&gt;场景、分镜、视频提示词&lt;/td&gt;&lt;td&gt;角色修改应失效引用该角色的分镜/视频。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;资产确认&lt;/span&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;版本建议&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;SceneContext&lt;/td&gt;&lt;td&gt;豪华会所私密包厢、主图、多视图。&lt;/td&gt;&lt;td&gt;场景设计师&lt;/td&gt;&lt;td&gt;道具、分镜、视频&lt;/td&gt;&lt;td&gt;多视图缺失曾阻断下游。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认依赖&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;PropContext&lt;/td&gt;&lt;td&gt;水杯、协议/文件、钢笔等道具卡。&lt;/td&gt;&lt;td&gt;道具设计师&lt;/td&gt;&lt;td&gt;分镜提示词、视频&lt;/td&gt;&lt;td&gt;道具修改应失效引用镜头。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;资产确认&lt;/span&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;失效建议&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;StoryboardContext&lt;/td&gt;&lt;td&gt;4个镜头、描述、台词、音效、角色/场景/道具引用、视频提示词。&lt;/td&gt;&lt;td&gt;分镜师&lt;/td&gt;&lt;td&gt;视频生成、预览&lt;/td&gt;&lt;td&gt;每镜头独立版本与生成状态。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;内容存在&lt;/span&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;引用结构&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;AssetContext&lt;/td&gt;&lt;td&gt;剧本、图片、视频、音频地址、类型、版本、来源任务。&lt;/td&gt;&lt;td&gt;工具/资产服务&lt;/td&gt;&lt;td&gt;画布、资产库、预览、下载&lt;/td&gt;&lt;td&gt;画布与资产库冲突证明当前同步不足。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;结构推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;WorkflowState&lt;/td&gt;&lt;td&gt;当前 Agent、任务状态、确认状态、错误、重试、交接。&lt;/td&gt;&lt;td&gt;Agent/工作流/工具&lt;/td&gt;&lt;td&gt;聊天、任务面板、路由&lt;/td&gt;&lt;td&gt;当前“生成中/无任务/已生成”不一致。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;状态表面存在&lt;/span&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;统一源&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;BillingContext&lt;/td&gt;&lt;td&gt;余额、预估、冻结、消耗、退款、调用关联。&lt;/td&gt;&lt;td&gt;计费服务&lt;/td&gt;&lt;td&gt;工具网关、工作流&lt;/td&gt;&lt;td&gt;每次高成本调用应可对账。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议设计&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;EvaluationContext&lt;/td&gt;&lt;td&gt;用户满意/修改、自动质量检查、失败原因、模型表现。&lt;/td&gt;&lt;td&gt;用户、验证器&lt;/td&gt;&lt;td&gt;路由、重试、产品分析&lt;/td&gt;&lt;td&gt;区分项目反馈与可复用模型评测。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议设计&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
          &lt;div class=&quot;oa-critical&quot;&gt;&lt;strong&gt;三处统一状态事实源缺失：&lt;/strong&gt;①聊天“正在生成”与任务列表“当前无任务”；②分镜视频完成与音效/BGM未完成；③画布有4个视频卡而资产库为空。&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s8&quot;&gt;
          &lt;h2&gt;8. 知识与公共资产架构&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;项目数据回答“这部片是什么”，知识与公共资产回答“怎样更好地生成”。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;类型&lt;/th&gt;&lt;th&gt;内容&lt;/th&gt;&lt;th&gt;归属&lt;/th&gt;&lt;th&gt;使用者&lt;/th&gt;&lt;th&gt;证据&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;项目数据&lt;/td&gt;&lt;td&gt;剧本、角色、场景、道具、分镜、视频、确认和状态。&lt;/td&gt;&lt;td&gt;项目私有&lt;/td&gt;&lt;td&gt;专业 Agent 与工作台&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;画布资产&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;专业知识&lt;/td&gt;&lt;td&gt;剧本结构、运镜、影视语言。&lt;/td&gt;&lt;td&gt;平台公共&lt;/td&gt;&lt;td&gt;编剧、分镜师&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;只确认公开摘要提及&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;模型能力知识&lt;/td&gt;&lt;td&gt;模型、模式、分辨率、音色兼容、时长限制。&lt;/td&gt;&lt;td&gt;平台公共&lt;/td&gt;&lt;td&gt;配置界面、路由&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;部分页面规则&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;风格知识&lt;/td&gt;&lt;td&gt;“3D言情”及可能的提示词模板/视觉约束。&lt;/td&gt;&lt;td&gt;平台公共&lt;/td&gt;&lt;td&gt;图像和视频阶段&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;选择可见，展开未知&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;提示词模板&lt;/td&gt;&lt;td&gt;角色主图、场景、分镜视频的模板。&lt;/td&gt;&lt;td&gt;平台公共&lt;/td&gt;&lt;td&gt;专业 Agent&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;行为推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;安全/版权/计费规则&lt;/td&gt;&lt;td&gt;拦截、授权、余额、价格、退款。&lt;/td&gt;&lt;td&gt;平台治理&lt;/td&gt;&lt;td&gt;工具网关&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;无页面样本&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;用户私有资产&lt;/td&gt;&lt;td&gt;角色参考、Face ID、音色、历史资产。&lt;/td&gt;&lt;td&gt;用户/租户私有&lt;/td&gt;&lt;td&gt;获授权项目&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;模板要求，当前未见&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;反馈和模型表现&lt;/td&gt;&lt;td&gt;满意/修改、失败原因、质量分数。&lt;/td&gt;&lt;td&gt;项目＋脱敏评测&lt;/td&gt;&lt;td&gt;局部重算、模型路由&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议设计&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

          &lt;h3&gt;七个关键问题&lt;/h3&gt;
          &lt;div class=&quot;oa-answer&quot;&gt;
            &lt;article&gt;&lt;h3&gt;风格如何变成模型信息？&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;推断&lt;/span&gt;“3D言情”应被解析为风格 ID、正负提示词、参考配置和适用模型参数；当前只看到选择值。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;角色参考如何跨分镜复用？&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;推断&lt;/span&gt;分镜师公开摘要提到获取角色代称；稳定实现应使用角色资产 ID/版本，而非复制提示词文本。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;分镜师从哪获得镜头知识？&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;页面摘要&lt;/span&gt;声称搜索“觉醒”相关分镜运镜知识；具体知识库和工具结果未知。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;系统如何知道模型限制？&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;页面规则&lt;/span&gt;模型配置展示分辨率与音色兼容；能力注册表属于合理推断，动态路由未证实。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;安全和计费放 Prompt 还是工具？&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议&lt;/span&gt;Prompt 只说明策略；安全拦截、余额冻结和扣费必须由工具/网关强制执行。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;用户反馈是否沉淀？&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未知&lt;/span&gt;当前只看到项目内“满意/修改”；建议区分项目局部反馈和脱敏后的模型评测数据。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;私有资产如何隔离？&lt;/h3&gt;&lt;p&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议&lt;/span&gt;租户/用户作用域、授权引用、短期签名地址、审计日志和禁止跨项目默认共享。&lt;/p&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s9&quot;&gt;
          &lt;h2&gt;9. 模型接入与路由架构&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;页面只直接暴露一个视频模型族，不能据此确认完整动态路由。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;能力&lt;/th&gt;&lt;th&gt;当前证据&lt;/th&gt;&lt;th&gt;可推断接入&lt;/th&gt;&lt;th&gt;建议路由规则&lt;/th&gt;&lt;th&gt;结论&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;文本模型&lt;/td&gt;&lt;td&gt;多个 Agent 生成规划、剧本和提示词。&lt;/td&gt;&lt;td&gt;存在文本生成能力。&lt;/td&gt;&lt;td&gt;按任务类型、上下文长度、成本和稳定性选择。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;合理推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;图片模型&lt;/td&gt;&lt;td&gt;角色、场景、道具图片实际存在。&lt;/td&gt;&lt;td&gt;存在图像生成能力。&lt;/td&gt;&lt;td&gt;按参考图、多视图、一致性、尺寸和风格能力选择。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;模型未命名&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;视频模型&lt;/td&gt;&lt;td&gt;Seedance 2.0；Pro/Fast；720p/480p。&lt;/td&gt;&lt;td&gt;页面配置直接映射调用参数。&lt;/td&gt;&lt;td&gt;能力注册表校验时长、分辨率、参考资产和音色。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;页面已确认&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;音频/TTS&lt;/td&gt;&lt;td&gt;自定义音色兼容提示；预览警告音效/BGM未生成。&lt;/td&gt;&lt;td&gt;可能存在独立音频能力。&lt;/td&gt;&lt;td&gt;台词、音色、语言、音画时长和授权校验。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未见音频结果&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;模型网关&lt;/td&gt;&lt;td&gt;无直接页面证据。&lt;/td&gt;&lt;td&gt;多媒体工具通常需要统一接入。&lt;/td&gt;&lt;td&gt;模型能力注册、路由、限流、安全、计费、重试、追踪。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议设计&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;切换与降级&lt;/td&gt;&lt;td&gt;Pro/Fast 可切换；是否换模型未知。&lt;/td&gt;&lt;td&gt;模式可能影响成本/速度。&lt;/td&gt;&lt;td&gt;不得在没有用户确认时降级质量或重复扣费。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;模式选择&lt;/span&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;动态路由&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s10&quot;&gt;
          &lt;h2&gt;10. 底层架构选型表&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;不猜厂商和语言，只给出能力、可能选型与推荐边界。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;子系统&lt;/th&gt;&lt;th&gt;需要具备的能力&lt;/th&gt;&lt;th&gt;可能选型&lt;/th&gt;&lt;th&gt;推荐方案&lt;/th&gt;&lt;th&gt;为何不能确认&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;聊天与画布前端&lt;/td&gt;&lt;td&gt;流式消息、节点画布、资产卡、任务状态、确认门。&lt;/td&gt;&lt;td&gt;现代 Web UI＋图编辑/画布框架。&lt;/td&gt;&lt;td&gt;事件驱动状态层，聊天与画布订阅同一项目事实源。&lt;/td&gt;&lt;td&gt;前端源码不可见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Agent 编排&lt;/td&gt;&lt;td&gt;专业 Agent 路由、上下文装配、交接、确认门。&lt;/td&gt;&lt;td&gt;工作流引擎、图编排或自研状态机。&lt;/td&gt;&lt;td&gt;显式 DAG＋持久化状态，不依赖聊天文本判断完成。&lt;/td&gt;&lt;td&gt;只见 UI 行为。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;异步任务 / 队列&lt;/td&gt;&lt;td&gt;长时视频任务、取消、回调、超时、重试。&lt;/td&gt;&lt;td&gt;消息队列＋任务执行器。&lt;/td&gt;&lt;td&gt;任务 ID、幂等键、租约、取消令牌和死信队列。&lt;/td&gt;&lt;td&gt;后台不可见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;模型网关 / 工具调用&lt;/td&gt;&lt;td&gt;统一模型参数、安全、计费、限流、追踪。&lt;/td&gt;&lt;td&gt;内部网关＋工具注册表。&lt;/td&gt;&lt;td&gt;能力注册表驱动路由；每次调用绑定项目、资产和账单。&lt;/td&gt;&lt;td&gt;页面只见 Seedance 选项。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;全局上下文 / 业务数据&lt;/td&gt;&lt;td&gt;结构化实体、事务、依赖、版本、确认与状态。&lt;/td&gt;&lt;td&gt;关系型/文档型数据库组合。&lt;/td&gt;&lt;td&gt;关系数据作为事实源，事件日志记录变化；禁止多表面各自写状态。&lt;/td&gt;&lt;td&gt;数据库不可见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;媒体存储 / CDN&lt;/td&gt;&lt;td&gt;大文件、版本、缩略图、签名访问、下载。&lt;/td&gt;&lt;td&gt;对象存储＋CDN。&lt;/td&gt;&lt;td&gt;不可变资产版本；元数据与对象分离；私有默认。&lt;/td&gt;&lt;td&gt;资产 URL 未展示。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;资产版本与依赖&lt;/td&gt;&lt;td&gt;引用图、失效、局部重算、回滚。&lt;/td&gt;&lt;td&gt;版本表＋依赖边。&lt;/td&gt;&lt;td&gt;内容哈希、producer_run_id、input_revision 和 lineage。&lt;/td&gt;&lt;td&gt;历史版本未见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;确认 / 中断&lt;/td&gt;&lt;td&gt;基于 revision 的确认、取消、恢复。&lt;/td&gt;&lt;td&gt;状态机事件。&lt;/td&gt;&lt;td&gt;确认绑定具体版本；中断阻止新调用，已完成结果标记未采用。&lt;/td&gt;&lt;td&gt;中断样本缺失。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;计费 / 额度&lt;/td&gt;&lt;td&gt;预估、冻结、扣减、退款、对账。&lt;/td&gt;&lt;td&gt;账本服务。&lt;/td&gt;&lt;td&gt;高成本调用前冻结；幂等结算；失败自动释放或退款。&lt;/td&gt;&lt;td&gt;只有 STAR 数值。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;安全与版权&lt;/td&gt;&lt;td&gt;输入/输出检测、素材授权、审计。&lt;/td&gt;&lt;td&gt;策略引擎＋模型安全服务。&lt;/td&gt;&lt;td&gt;工具层强制，Prompt 仅提示；保留规则版本与命中证据。&lt;/td&gt;&lt;td&gt;无拦截样本。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;日志与链路追踪&lt;/td&gt;&lt;td&gt;AgentRun、ToolCall、ModelInvocation、状态写入。&lt;/td&gt;&lt;td&gt;结构化日志＋分布式追踪。&lt;/td&gt;&lt;td&gt;统一 trace_id 贯穿用户事件、任务、资产和账单。&lt;/td&gt;&lt;td&gt;页面无调试信息。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;评测与知识检索&lt;/td&gt;&lt;td&gt;质量检查、知识版本、模型表现。&lt;/td&gt;&lt;td&gt;检索系统＋离线/在线评测。&lt;/td&gt;&lt;td&gt;知识库来源和版本可追踪；用户反馈脱敏后再聚合。&lt;/td&gt;&lt;td&gt;仅见公开摘要。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;权限与隔离&lt;/td&gt;&lt;td&gt;用户/项目/资产授权、分享边界。&lt;/td&gt;&lt;td&gt;RBAC/ABAC＋租户作用域。&lt;/td&gt;&lt;td&gt;默认私有、最小权限、签名 URL、跨项目引用审批。&lt;/td&gt;&lt;td&gt;权限界面未见。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s11&quot;&gt;
          &lt;h2&gt;11. 数据实体表与 ER 图&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;实体名称来自分析模板，不代表 OiiOii 使用相同表名。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;实体&lt;/th&gt;&lt;th&gt;职责&lt;/th&gt;&lt;th&gt;关键关系&lt;/th&gt;&lt;th&gt;页面证据&lt;/th&gt;&lt;th&gt;分类&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;User&lt;/td&gt;&lt;td&gt;用户、语言、权限和额度。&lt;/td&gt;&lt;td&gt;拥有 Project、Asset、BillingRecord。&lt;/td&gt;&lt;td&gt;头像、中文、STAR。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;结构推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Project / Conversation&lt;/td&gt;&lt;td&gt;项目与聊天上下文。&lt;/td&gt;&lt;td&gt;包含 Workflow、Task、业务实体。&lt;/td&gt;&lt;td&gt;项目标题、Oii Agent 会话。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;概念存在&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Agent / AgentRun&lt;/td&gt;&lt;td&gt;身份定义与一次运行。&lt;/td&gt;&lt;td&gt;执行 Task，产生 ToolCall。&lt;/td&gt;&lt;td&gt;Agent 名称、规划/思考摘要。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;Run 结构推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Workflow / Task&lt;/td&gt;&lt;td&gt;阶段、状态、交接和确认门。&lt;/td&gt;&lt;td&gt;关联 AgentRun 和 UserConfirmation。&lt;/td&gt;&lt;td&gt;激活工作流、任务列表、邀请事件。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;概念存在&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;ToolCall / ModelInvocation&lt;/td&gt;&lt;td&gt;业务工具和底层模型调用。&lt;/td&gt;&lt;td&gt;产生 Asset、Error、BillingRecord。&lt;/td&gt;&lt;td&gt;仅有动作卡和结果，真实调用不可见。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;合理推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Script / Character / Scene / Prop / Storyboard&lt;/td&gt;&lt;td&gt;创作业务实体。&lt;/td&gt;&lt;td&gt;按依赖链生产并被分镜引用。&lt;/td&gt;&lt;td&gt;对应画布资产卡。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;实体概念&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Asset / AssetVersion&lt;/td&gt;&lt;td&gt;文本、图片、视频、音频与版本。&lt;/td&gt;&lt;td&gt;由业务实体和 ToolCall 引用。&lt;/td&gt;&lt;td&gt;资产卡存在；版本未见。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;Asset&lt;/span&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;Version&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;UserConfirmation&lt;/td&gt;&lt;td&gt;记录满意、修改、预览确认。&lt;/td&gt;&lt;td&gt;绑定 Task 和 revision。&lt;/td&gt;&lt;td&gt;多个确认按钮和用户消息。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;事件存在&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Error / BillingRecord / Feedback&lt;/td&gt;&lt;td&gt;错误、账单、反馈。&lt;/td&gt;&lt;td&gt;关联任务、调用和用户。&lt;/td&gt;&lt;td&gt;预览警告、STAR、满意/修改。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;结构推断&lt;/span&gt;&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;

        &lt;section id=&quot;s12&quot;&gt;
          &lt;h2&gt;12. 端到端时序图&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;示例输入为“完整剧本＋角色参考图”。参考图并未出现在当前截图，因此相关处理标为合理推断/建议。&lt;/p&gt;
          &lt;div class=&quot;oa-mermaid&quot;&gt;&lt;pre class=&quot;mermaid&quot;&gt;sequenceDiagram
    autonumber
    actor U as 用户
    participant UI as 聊天/画布工作台
    participant O as Oii Agent（可能主控）
    participant A as 专业 Agent
    participant WF as 工作流/状态服务
    participant GC as 全局上下文
    participant TS as 工具服务
    participant SC as 安全/计费服务
    participant MG as 模型网关
    participant AS as 资产服务

    U-&gt;&gt;UI: 提交完整剧本＋角色参考图
    UI-&gt;&gt;O: 创建/恢复项目事件
    O--&gt;&gt;WF: 路由入口 Agent（合理推断）
    WF-&gt;&gt;GC: 写入需求、素材引用、项目参数
    A-&gt;&gt;GC: 读取当前阶段输入与上游版本
    A--&gt;&gt;UI: 展示参数与确认门
    U-&gt;&gt;UI: 确认 / 修改 / 中断
    alt 用户确认
        UI-&gt;&gt;WF: confirmation(revision)
        A-&gt;&gt;TS: 调用当前阶段工具
        TS-&gt;&gt;SC: 安全检查＋额度预估/冻结（建议）
        alt 安全通过且余额充足
            SC--&gt;&gt;TS: allow + reservation_id
            TS-&gt;&gt;MG: 调用文本/图片/视频模型
            MG--&gt;&gt;TS: 异步任务 id
            loop 异步等待与状态事件
                TS--&gt;&gt;WF: progress / heartbeat
                WF--&gt;&gt;UI: 更新任务状态
            end
            MG--&gt;&gt;TS: 生成结果
            TS-&gt;&gt;AS: 保存不可变资产版本
            AS--&gt;&gt;TS: asset_ref + version
            TS-&gt;&gt;GC: 写入资产引用、lineage、结果状态
            TS-&gt;&gt;SC: 结算 / 释放冻结（建议）
            A-&gt;&gt;GC: 回读结果并验证状态一致
            alt 验证通过
                A--&gt;&gt;UI: 展示结果与满意/修改
                U-&gt;&gt;UI: 满意，请继续
                UI-&gt;&gt;WF: 下游交接事件
                WF-&gt;&gt;A: 启动下一专业 Agent
            else 质量或状态不一致
                A--&gt;&gt;UI: 展示冲突与局部重算建议
            end
        else 安全拦截或余额不足
            SC--&gt;&gt;UI: 原因与可选后续
            WF-&gt;&gt;GC: 写入 blocked 状态
        end
    else 用户修改
        UI-&gt;&gt;GC: 新建上游 revision
        GC--&gt;&gt;WF: 标记依赖资产失效（建议）
        WF-&gt;&gt;A: 仅重算受影响阶段
    else 用户中断
        UI-&gt;&gt;WF: interrupt event
        WF-&gt;&gt;TS: 取消未开始调用 / 标记运行中结果未采用
        WF-&gt;&gt;GC: 保存可恢复快照
    end&lt;/pre&gt;&lt;/div&gt;

专业Agent-&amp;gt;&amp;gt;工具服务: 调用生成
工具服务-&amp;gt;&amp;gt;安全/计费: 检查与冻结
工具服务-&amp;gt;&amp;gt;模型网关: 异步调用
模型网关--&amp;gt;&amp;gt;资产服务: 结果
资产服务-&amp;gt;&amp;gt;全局上下文: 写入资产引用

          &lt;h3&gt;主图必须回答的 13 个问题&lt;/h3&gt;
          &lt;div class=&quot;oa-answer&quot;&gt;
            &lt;article&gt;&lt;h3&gt;需求从哪里进入？&lt;/h3&gt;&lt;p&gt;聊天和表单进入项目工作流。ARC-E01、E14&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;谁决定调用 Agent？&lt;/h3&gt;&lt;p&gt;Oii Agent/工作流可能路由，但当前未直接证实。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;Agent 从哪获得输入？&lt;/h3&gt;&lt;p&gt;项目上下文与上游资产；真实 payload 未展示。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;Agent 调用什么工具？&lt;/h3&gt;&lt;p&gt;以功能命名表示文本、图片、视频、上下文和资产工具。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;图片和视频由谁生成？&lt;/h3&gt;&lt;p&gt;专业 Agent 驱动生成工具；底层模型除 Seedance 外未知。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;结果存在哪里？&lt;/h3&gt;&lt;p&gt;画布资产卡可见；底层 AssetContext/对象存储为推断。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;下游如何拿上游资产？&lt;/h3&gt;&lt;p&gt;通过项目上下文的资产引用；引用结构未知。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;用户如何确认或修改？&lt;/h3&gt;&lt;p&gt;满意/修改按钮、卡片提示词编辑、预览确认弹窗。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;失败后怎么办？&lt;/h3&gt;&lt;p&gt;仅场景缺多视图有补偿样本；其他失败路径未知。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;余额不足在哪里拦截？&lt;/h3&gt;&lt;p&gt;当前无证据；To-Be 在工具/模型网关前由安全计费服务拦截。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;风格和镜头知识从哪来？&lt;/h3&gt;&lt;p&gt;风格选择器、公开知识搜索摘要；实际知识库调用未知。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;如何保证角色一致性？&lt;/h3&gt;&lt;p&gt;角色资产和代称被引用；Face ID/锁脸机制未证实。&lt;/p&gt;&lt;/article&gt;
            &lt;article&gt;&lt;h3&gt;如何判断整个任务完成？&lt;/h3&gt;&lt;p&gt;当前缺统一完成门；建议同时验证资产、状态、音频、确认和交接。&lt;/p&gt;&lt;/article&gt;
          &lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s14&quot;&gt;
          &lt;h2&gt;14. 当前架构 As-Is&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;只记录页面事实和强行为推断。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;主题&lt;/th&gt;&lt;th&gt;当前表现&lt;/th&gt;&lt;th&gt;证据等级&lt;/th&gt;&lt;th&gt;影响&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;入口与协作&lt;/td&gt;&lt;td&gt;聊天承载多 Agent；仅道具→分镜有明确邀请。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;其他交接 payload 不透明。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;资产生产&lt;/td&gt;&lt;td&gt;剧本、角色、场景、道具、分镜视频依次出现在画布。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;资产 lineage 和版本不可见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;用户确认&lt;/td&gt;&lt;td&gt;阶段性满意/修改；试片后批量生成；预览不完整警告。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;确认是否绑定具体版本未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;依赖检查&lt;/td&gt;&lt;td&gt;场景多视图缺失会阻断道具并触发补偿。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;说明存在局部前置检查，但覆盖范围未知。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;状态事实源&lt;/td&gt;&lt;td&gt;聊天、任务、画布、资产库互相冲突。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;用户无法判断真正完成度。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;模型&lt;/td&gt;&lt;td&gt;Seedance 2.0、模式与分辨率可选。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;动态路由、降级和成本不可见。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;异常、计费、安全&lt;/td&gt;&lt;td&gt;仅见 STAR 数值和素材不完整警告。&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;未知&lt;/span&gt;&lt;/td&gt;&lt;td&gt;无法判断失败恢复和扣费安全。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s15&quot;&gt;
          &lt;h2&gt;15. 建议架构 To-Be&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;为稳定性新增的产品架构，不描述为 OiiOii 当前事实。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;补充能力&lt;/th&gt;&lt;th&gt;设计要求&lt;/th&gt;&lt;th&gt;触发位置&lt;/th&gt;&lt;th&gt;验收条件&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;统一状态事实源&lt;/td&gt;&lt;td&gt;聊天、任务、画布、资产库只读同一 WorkflowState/AssetContext。&lt;/td&gt;&lt;td&gt;所有任务事件和资产写入。&lt;/td&gt;&lt;td&gt;同一 task_id 在四个表面状态一致。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Agent 完成门&lt;/td&gt;&lt;td&gt;不能以“规划完成/思考完成”为完成；要求结果存在、状态写入、验证通过、确认记录和交接完整。&lt;/td&gt;&lt;td&gt;每个 Agent handoff 前。&lt;/td&gt;&lt;td&gt;缺任一项禁止进入 completed。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;质量验证&lt;/td&gt;&lt;td&gt;剧本一致性、角色/场景/道具引用、风格、时长、台词、音画同步。&lt;/td&gt;&lt;td&gt;资产生成后、用户确认前。&lt;/td&gt;&lt;td&gt;验证报告绑定资产版本。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;依赖失效与局部重算&lt;/td&gt;&lt;td&gt;维护 producer/consumer 依赖图；上游 revision 变化只重算受影响资产。&lt;/td&gt;&lt;td&gt;用户修改剧本、角色、场景、道具或参数时。&lt;/td&gt;&lt;td&gt;旧版本保留，新版本依赖可追踪。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;幂等重试&lt;/td&gt;&lt;td&gt;工具调用使用 idempotency_key；状态写入失败不重复生成。&lt;/td&gt;&lt;td&gt;异步任务和回调。&lt;/td&gt;&lt;td&gt;同一请求最多产生一个计费资产版本。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;额度预估与冻结&lt;/td&gt;&lt;td&gt;生成前预估并冻结；失败释放或退款；账单绑定 ModelInvocation。&lt;/td&gt;&lt;td&gt;图片/视频/音频调用前。&lt;/td&gt;&lt;td&gt;用户可对账，不因自动重试重复扣费。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;中断与恢复&lt;/td&gt;&lt;td&gt;停止新任务，传递取消令牌；已完成结果标记未采用；保存恢复点。&lt;/td&gt;&lt;td&gt;任何运行状态。&lt;/td&gt;&lt;td&gt;中断后无新调用，恢复从确定 revision 开始。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;全链路追踪&lt;/td&gt;&lt;td&gt;trace_id 贯穿用户事件、AgentRun、ToolCall、模型调用、资产和账单。&lt;/td&gt;&lt;td&gt;项目入口。&lt;/td&gt;&lt;td&gt;一次结果可追溯全部输入与状态变化。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;模型能力与反馈&lt;/td&gt;&lt;td&gt;能力注册表版本化；收集失败率、成本、延迟和质量反馈。&lt;/td&gt;&lt;td&gt;模型网关。&lt;/td&gt;&lt;td&gt;模型变化不使旧路由静默失效。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s16&quot;&gt;
          &lt;h2&gt;16. 关键风险&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;按用户影响、成本风险和数据安全排序。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;优先级&lt;/th&gt;&lt;th&gt;风险&lt;/th&gt;&lt;th&gt;当前证据&lt;/th&gt;&lt;th&gt;可能后果&lt;/th&gt;&lt;th&gt;建议控制&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td class=&quot;oa-priority&quot;&gt;P0&lt;/td&gt;&lt;td&gt;聊天、任务、画布、资产库状态冲突&lt;/td&gt;&lt;td&gt;ARC-E10、E13&lt;/td&gt;&lt;td&gt;误判完成、重复操作、资产丢失感。&lt;/td&gt;&lt;td&gt;统一事实源＋事件对账。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td class=&quot;oa-priority&quot;&gt;P0&lt;/td&gt;&lt;td&gt;Agent 口头完成但工具或资产未完成&lt;/td&gt;&lt;td&gt;“正在生成”与“已生成”并存；预览警告。&lt;/td&gt;&lt;td&gt;错误交接和最终预览失败。&lt;/td&gt;&lt;td&gt;Agent 完成门。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td class=&quot;oa-priority&quot;&gt;P0&lt;/td&gt;&lt;td&gt;资产成功但上下文未更新&lt;/td&gt;&lt;td&gt;画布有视频，资产库为空。&lt;/td&gt;&lt;td&gt;下游拿不到资产、重复生成。&lt;/td&gt;&lt;td&gt;资产写入事务＋修复任务。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;上游修改后下游不失效&lt;/td&gt;&lt;td&gt;未见依赖失效机制。&lt;/td&gt;&lt;td&gt;角色/分镜/视频不一致。&lt;/td&gt;&lt;td&gt;版本化依赖图＋局部重算。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;自动重试重复扣费&lt;/td&gt;&lt;td&gt;重试和账单机制未知。&lt;/td&gt;&lt;td&gt;成本争议和重复资产。&lt;/td&gt;&lt;td&gt;幂等键＋冻结/结算账本。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;时长、风格和台词校验缺失&lt;/td&gt;&lt;td&gt;页面未显示验证报告。&lt;/td&gt;&lt;td&gt;偏离原剧本、视频不可用。&lt;/td&gt;&lt;td&gt;生成后自动验证器。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;用户中断后后台继续&lt;/td&gt;&lt;td&gt;无中断样本。&lt;/td&gt;&lt;td&gt;浪费额度和产生孤儿资产。&lt;/td&gt;&lt;td&gt;取消令牌＋未采用结果状态。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;P1&lt;/td&gt;&lt;td&gt;私有资产权限泄漏&lt;/td&gt;&lt;td&gt;权限隔离不可见。&lt;/td&gt;&lt;td&gt;角色参考、音色或历史资产跨用户暴露。&lt;/td&gt;&lt;td&gt;租户作用域、签名访问、审计。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;安全误判与恢复不透明&lt;/td&gt;&lt;td&gt;无安全错误样本。&lt;/td&gt;&lt;td&gt;用户无法理解或修正。&lt;/td&gt;&lt;td&gt;规则版本、原始原因、人工申诉。&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;P2&lt;/td&gt;&lt;td&gt;知识与模型能力过期&lt;/td&gt;&lt;td&gt;知识/路由版本不可见。&lt;/td&gt;&lt;td&gt;无效参数、质量波动、失败率上升。&lt;/td&gt;&lt;td&gt;知识版本和能力注册表健康检查。&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s17&quot;&gt;
          &lt;h2&gt;17. 架构组件—证据追溯表&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;任何没有证据、也没有清晰设计理由的组件都不进入主图。&lt;/p&gt;
          &lt;div class=&quot;oa-table&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;组件&lt;/th&gt;&lt;th&gt;为什么需要&lt;/th&gt;&lt;th&gt;证据&lt;/th&gt;&lt;th&gt;分类&lt;/th&gt;&lt;th&gt;置信度&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;聊天/画布/资产/任务工作台&lt;/td&gt;&lt;td&gt;用户操作与状态展示。&lt;/td&gt;&lt;td&gt;ARC-E14、E10–13&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;专业 Agent 链&lt;/td&gt;&lt;td&gt;分阶段生产不同资产。&lt;/td&gt;&lt;td&gt;ARC-E01–09&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;身份/阶段&lt;/span&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;部分交接&lt;/span&gt;&lt;/td&gt;&lt;td&gt;中高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Oii Agent 主控&lt;/td&gt;&lt;td&gt;页面会话壳可能承担路由。&lt;/td&gt;&lt;td&gt;所有截图顶部 Oii Agent&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;主控角色未知&lt;/span&gt;&lt;/td&gt;&lt;td&gt;低&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;工作流/任务状态&lt;/td&gt;&lt;td&gt;长流程和异步视频生成需要状态。&lt;/td&gt;&lt;td&gt;激活工作流、任务面板、生成摘要&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;概念存在&lt;/span&gt;&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;全局上下文&lt;/td&gt;&lt;td&gt;下游必须读取剧本和上游资产。&lt;/td&gt;&lt;td&gt;阶段结果连续复用&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;合理推断&lt;/span&gt;&lt;/td&gt;&lt;td&gt;中高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;资产服务&lt;/td&gt;&lt;td&gt;图片/视频卡、预览和下载需要统一引用。&lt;/td&gt;&lt;td&gt;画布资产与下载入口&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;合理推断&lt;/span&gt;&lt;/td&gt;&lt;td&gt;中高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;文本/图片模型&lt;/td&gt;&lt;td&gt;剧本和图片结果需要生成能力。&lt;/td&gt;&lt;td&gt;实际产物&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag inferred&quot;&gt;模型未命名&lt;/span&gt;&lt;/td&gt;&lt;td&gt;中高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;Seedance 2.0&lt;/td&gt;&lt;td&gt;视频生成配置。&lt;/td&gt;&lt;td&gt;ARC-E07&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;已确认&lt;/span&gt;&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;剧本/运镜知识&lt;/td&gt;&lt;td&gt;公开摘要明确提到搜索。&lt;/td&gt;&lt;td&gt;ARC-E02、E08&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag confirmed&quot;&gt;摘要存在&lt;/span&gt;&lt;span class=&quot;oa-tag unknown&quot;&gt;调用未知&lt;/span&gt;&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;统一状态机与完成门&lt;/td&gt;&lt;td&gt;解决三类状态冲突。&lt;/td&gt;&lt;td&gt;ARC-E10–13＋设计理由&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议设计&lt;/span&gt;&lt;/td&gt;&lt;td&gt;高&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;安全/计费服务&lt;/td&gt;&lt;td&gt;控制高成本生成与平台规则。&lt;/td&gt;&lt;td&gt;STAR＋明确设计理由&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议设计&lt;/span&gt;&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;数据库、队列、对象存储、追踪、权限&lt;/td&gt;&lt;td&gt;持久化、异步媒体、资产访问和治理所需。&lt;/td&gt;&lt;td&gt;产品能力需求，不是页面实现证据&lt;/td&gt;&lt;td&gt;&lt;span class=&quot;oa-tag suggested&quot;&gt;建议能力&lt;/span&gt;&lt;/td&gt;&lt;td&gt;中&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;
        &lt;/section&gt;

        &lt;section id=&quot;s18&quot;&gt;
          &lt;h2&gt;18. 仍然无法确认的问题&lt;/h2&gt;&lt;p class=&quot;oa-lead&quot;&gt;这些问题决定下一轮取证优先级，但本报告不以猜测填空。&lt;/p&gt;
          &lt;ol&gt;
            &lt;li&gt;Oii Agent 是单纯会话壳、路由器，还是具备项目编排和上下文装配能力的主控 Agent？&lt;/li&gt;
            &lt;li&gt;角色阶段 Agent 的页面正式名称是什么？是否存在独立 Face ID、锁脸或角色一致性服务？&lt;/li&gt;
            &lt;li&gt;除“道具设计师邀请分镜师”外，其他 Agent 的触发事件、payload 和下游接收回执是什么？&lt;/li&gt;
            &lt;li&gt;剧本知识、运镜知识和角色/道具代称是否真的通过工具检索；工具结果如何呈现与版本化？&lt;/li&gt;
            &lt;li&gt;ProjectConfig、AssetContext、WorkflowState 的真实字段和单一事实源在哪里？&lt;/li&gt;
            &lt;li&gt;画布资产为什么没有同步到资产库；这是权限、索引、类型过滤还是状态写入失败？&lt;/li&gt;
            &lt;li&gt;视频片段完成后，音效、BGM、台词和最终合成由谁负责；是否存在未展示的音频 Agent？&lt;/li&gt;
            &lt;li&gt;Seedance 2.0 的时长、参考图、音色、费用和失败规则如何被前端与工作流校验？&lt;/li&gt;
            &lt;li&gt;积分不足、安全拦截、生成失败、自动重试、用户中断和退款的真实页面行为是什么？&lt;/li&gt;
            &lt;li&gt;用户修改剧本、角色、场景或道具后，下游分镜和视频是否自动失效并支持局部重算？&lt;/li&gt;
            &lt;li&gt;是否存在 AssetVersion、历史项目版本、回滚和确认绑定 revision 的能力？&lt;/li&gt;
            &lt;li&gt;认证、权限、私有资产隔离、对象存储、队列、数据库、日志和云服务的真实实现是什么？&lt;/li&gt;
          &lt;/ol&gt;
          &lt;div class=&quot;oa-callout&quot;&gt;&lt;strong&gt;最终边界：&lt;/strong&gt;当前证据可确认产品的用户可见创作链路与多个状态裂缝；后端技术栈、真实 API、模型调用参数、计费安全和持久化结构仍未确认。&lt;/div&gt;
        &lt;/section&gt;
        &lt;div class=&quot;oa-footer&quot;&gt;取证范围：S01–S18；证据冻结日期：2026-08-18。未操作 OiiOii 页面，未调用生成、发布、删除、充值或覆盖能力。&lt;/div&gt;
      &lt;/main&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
